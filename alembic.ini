[alembic]
script_location = db/migrations
prepend_sys_path = packages/legal_core
path_separator = os
# The database URL comes from DATABASE_URL (see db/migrations/env.py).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
